<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingpu</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-rail" aria-label="Project controls">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Lingpu</h1>
            <p>Local transcription workbench</p>
          </div>
        </div>

        <form id="upload-form" class="upload-box">
          <label for="audio-file">Audio file</label>
          <input id="audio-file" name="file" type="file" accept="audio/*" required />
          <button type="submit">Create project</button>
        </form>

        <section class="rail-section">
          <h2>Recent projects</h2>
          <label for="recent-projects">Open project</label>
          <select id="recent-projects"></select>
          <button id="open-project-button" type="button" disabled>Open project</button>
        </section>

        <section class="rail-section">
          <h2>Process</h2>
          <label for="separation-engine">Separation engine</label>
          <select id="separation-engine"></select>
          <button id="separate-button" type="button" disabled>Separate stems</button>
          <label for="transcription-engine">Transcription engine</label>
          <select id="transcription-engine"></select>
          <button id="transcribe-button" type="button" disabled>Transcribe selected stem</button>
        </section>

        <section class="rail-section">
          <h2>Score settings</h2>
          <form id="score-settings-form" class="settings-form">
            <fieldset id="score-settings-fieldset" disabled>
              <label for="score-tempo">Tempo</label>
              <input id="score-tempo" name="tempo" type="number" min="40" max="240" step="1" value="120" required />
              <label for="score-time-signature">Time signature</label>
              <select id="score-time-signature" name="timeSignature" required>
                <option value="2/4">2/4</option>
                <option value="3/4">3/4</option>
                <option value="4/4" selected>4/4</option>
                <option value="6/8">6/8</option>
                <option value="12/8">12/8</option>
              </select>
              <label for="score-key-signature">Key signature</label>
              <select id="score-key-signature" name="keySignature" required>
                <option value="Cb">Cb</option>
                <option value="Gb">Gb</option>
                <option value="Db">Db</option>
                <option value="Ab">Ab</option>
                <option value="Eb">Eb</option>
                <option value="Bb">Bb</option>
                <option value="F">F</option>
                <option value="C" selected>C</option>
                <option value="G">G</option>
                <option value="D">D</option>
                <option value="A">A</option>
                <option value="E">E</option>
                <option value="B">B</option>
                <option value="F#">F#</option>
                <option value="C#">C#</option>
              </select>
              <label for="score-quantization">Quantization</label>
              <select id="score-quantization" name="quantization" required>
                <option value="1/4">1/4</option>
                <option value="1/8">1/8</option>
                <option value="1/16" selected>1/16</option>
                <option value="1/32">1/32</option>
              </select>
              <button id="save-score-settings" type="submit">Save settings</button>
            </fieldset>
          </form>
        </section>

        <section class="rail-section">
          <h2>Export</h2>
          <div class="button-row">
            <button id="export-midi" type="button" disabled>MIDI</button>
            <button id="export-musicxml" type="button" disabled>MusicXML</button>
            <button id="export-pdf" type="button" disabled>PDF</button>
          </div>
        </section>

        <p id="status-line" class="status-line">No project loaded.</p>
      </aside>

      <section class="score-stage" aria-label="Score preview">
        <header class="stage-header">
          <div>
            <span class="eyebrow">Project</span>
            <h2 id="project-title">Waiting for audio</h2>
          </div>
          <div id="project-meta" class="meta-strip">Upload a WAV, MP3, or M4A file.</div>
        </header>

        <section class="mixer-panel" aria-label="Stem mixer">
          <div class="mixer-header">
            <h3>Stem mixer</h3>
            <div class="stem-transport">
              <button id="stem-play-button" type="button" disabled>Play</button>
              <button id="stem-stop-button" type="button" disabled>Stop</button>
              <span id="stem-time">0:00 / --:--</span>
              <div class="stem-timeline" aria-hidden="true">
                <div id="stem-playhead" class="stem-playhead"></div>
              </div>
            </div>
          </div>
          <div class="stem-strip" id="stem-strip" aria-label="Stem list"></div>
        </section>

        <section class="playback-strip" aria-label="Transcribed note playback">
          <div class="transport-controls">
            <button id="note-play-button" type="button" disabled>Play</button>
            <button id="note-stop-button" type="button" disabled>Stop</button>
          </div>
          <div class="playback-meter">
            <span id="playback-time">0.00s</span>
            <div class="playback-timeline" aria-hidden="true">
              <div id="playback-playhead" class="playback-playhead"></div>
            </div>
          </div>
        </section>

        <section class="score-panel">
          <div class="panel-heading">
            <h3>Score preview</h3>
            <div class="score-window-controls">
              <button id="view-prev-button" class="view-button" type="button" disabled>Prev</button>
              <span id="view-window-label">0.00s-0.00s</span>
              <button id="view-next-button" class="view-button" type="button" disabled>Next</button>
              <span id="score-settings">120 BPM / 4/4 / C / 1/16</span>
            </div>
          </div>
          <svg id="score-svg" class="score-svg" viewBox="0 0 920 260" role="img" aria-label="Generated notation preview"></svg>
        </section>

        <section class="roll-panel">
          <div class="panel-heading">
            <h3>Piano roll</h3>
            <span id="note-count">0 notes</span>
          </div>
          <div id="piano-roll" class="piano-roll"></div>
        </section>
      </section>

      <aside class="editor-rail" aria-label="Note editor">
        <div class="editor-header">
          <h2>Notes</h2>
          <button id="save-notes" type="button" disabled>Save edits</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Pitch</th>
                <th>Start</th>
                <th>End</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="notes-body"></tbody>
          </table>
        </div>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
